name: Auto-update tournament data

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  fetch-and-build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Setup FFmpeg using a dedicated action that leverages tool caching
      # This is much faster than running `apt-get update && apt-get install` every time.
      - uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable

      # 2. Point rust-cache to your specific subdirectory. 
      # Without this, it looks in the root for Cargo.toml/lock and misses `ssg/target/`.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "ssg"
          # Optional: add a custom prefix to invalidate cache if needed
          # prefix-key: "v1-rust"

      - working-directory: ssg
        env:
          STARTGGAPI: ${{ secrets.STARTGGAPI }}
          KIT_V3_API_SECRET: ${{ secrets.KIT_V3_API_SECRET }}
        run: cargo run

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'site/'

      - id: deployment
        uses: actions/deploy-pages@v4
